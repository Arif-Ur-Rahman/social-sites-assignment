<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/instagram.css">

</head>
<body>
    <main class="instagram">
        <a href="index.html">← Back to Home</a>
        <section class="instagram-profile">
                <header class="profile-header">
                    <img class="profile-pic" src="images/my.jpeg" alt="Instagram Profile Picture">
                    <div class="profile-info">
                        <div class="profile-name">
                            <h1>Jabir Chowdhury</h1>
                            <button type="button" class="button-follow">Follow</button>


                        </div>
                        <ul class="profile-stats">
                            <li><strong>10</strong> posts</li>
                            <li><strong>1000</strong> followers</li>
                            <li><strong>100</strong> following</li>
                        </ul>
                        <div class="profile-bio">
                            <p>Web Developer</p>
                            <p>Learning, building and growing everyday.</p>
                        </div>
                   </div>

                </header> 
                <section class="photo-grid">
                    <a href="images/">
                        <h2>Photo Gallary</h2>
                    </a>
                    

                    <ul class="photo-lists">

                            <img src="images/pic1.jpg" alt="milan train station">

                        <li>
                            <img src="images/pic2.jpg" alt="milano naviglio">

                        <li>

                        </li>
                        <li>

                        </li>
                        <li>
                            <img src="images/pic5.jpg" alt="garibuldi">

                        </li>
                        <li>
                            <img src="images/pic6.jpg" alt="tre torre">
                        </li>
                        <li>
                            <img src="images/pic7.jpg" alt="vittoria emanuele">
                        </li>
                        <li>
                            <img src="images/pic9.jpg" alt="duomo">
                        </li>
                        <li>
                            <img src="images/pic8.jpg" alt="naviglio eclips">
                        </li>
                    </ul>


                </section>

           


        </section>
    </main>

</html>
