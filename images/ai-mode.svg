<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
    <style>
        .sparkle { transform-box: fill-box; transform-origin: center; animation: twinkle 2.4s ease-in-out infinite; }
        @keyframes twinkle {
            0%, 60%, 100% { transform: scale(1) rotate(0deg); }
            75% { transform: scale(1.35) rotate(45deg); }
            90% { transform: scale(0.85) rotate(90deg); }
        }
        @media (prefers-reduced-motion: reduce) { .sparkle { animation: none; } }
    </style>
    <circle cx="10" cy="13" r="6" fill="none" stroke="#1f1f1f" stroke-width="2"/>
    <path d="M14.5 17.5 20 23" stroke="#1f1f1f" stroke-width="2" stroke-linecap="round"/>
    <path class="sparkle" d="M18 1l1.2 2.8L22 5l-2.8 1.2L18 9l-1.2-2.8L14 5l2.8-1.2z" fill="#1f1f1f"/>
</svg>
