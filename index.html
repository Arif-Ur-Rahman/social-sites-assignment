<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Social Sites</title>
    <link rel="stylesheet" href="css/style.css">
    
</head>
<body>
    <h1>Social Sites</h1>
    <ul class="shortcuts">
        <li>
            <a href="facebook.html">
            <span class="tile"><img src="images/logo-facebook.svg" alt="facebook logo"></span>
            <span class="label">facebook</span>
            </a>
            <button type="button" class="more" aria-label="more action for facebook.html">
                <img src="images/more.svg" alt="">
            </button>
        </li>
        <li>
            <a href="google.html">
                <span class="tile"><img src="images/logo-google.svg" alt="google logo"></span>
                <span class="label">Google</span>

            </a>
            <button type="button" class="more" aria-label="more action for google.html">
                <img src="images/more.svg" alt="more logo">
            </button>
        </li>
        <li>
            <a href="instragram.html">
                <span class="tile"><img src="images/logo-instagram.svg" alt="instragram logo"></span>
                <span class="label">Instragram</span>
            </a>
            <button type="button" class="more" aria-label="more action for instragram.html">
                <img src="images/more.svg" alt="">
            </button>
        </li>
        <li>
            <a href="linkedin.html">
                <span class="tile"><img src="images/logo-linkedin.svg" alt="Instragram logo"></span>
                <span class="label">Linkedin</span>
            </a>
            <button type="button" class="more" aria-label="more action for instragram.html">
                <img src="images/more.svg" alt="">
            </button>
        </li>
    </ul>

</body>
</html>
